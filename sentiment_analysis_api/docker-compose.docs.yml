services:
  docs:
    image: sentiment_analysis_api_local_docs
    container_name: sentiment_analysis_api_local_docs
    build:
      context: .
      dockerfile: ./compose/local/docs/Dockerfile
    env_file:
      - ./.envs/.local/.django
    volumes:
      - ./docs:/docs:z
      - ./config:/app/config:z
      - ./sentiment_analysis_api:/app/sentiment_analysis_api:z
    ports:
      - '9000:9000'
    command: /start-docs
